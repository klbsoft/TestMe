[package]
name = "admin"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "teacher-cli"
path = "src/main.rs"

[dependencies]
# web / async
axum       = { version = "0.7", features = ["multipart"] }
tokio      = { version = "1", features = ["full"] }
tower-http = { version = "0.5", features = ["cors"] }

# serde / json
serde      = { version = "1", features = ["derive"] }
serde_json = "1.0"

# time / ids
chrono = { version = "0.4", features = ["serde"] }
uuid   = { version = "1", features = ["v4"] }

# hashing / crypto
argon2           = { version = "0.5", features = ["std"] }
aes-gcm          = "0.10"
chacha20poly1305 = "0.10"
sha2             = "0.10"
sha3             = "0.10"
hmac             = "0.12"
blake3           = "1.5"
hex              = "0.4"
base64           = "0.21"
rand             = "0.8"

# auth / tokens
jsonwebtoken = "9.3.1"

# storage
mongodb  = "3.1"
rusqlite = "0.31"

# cli / errors
clap   = { version = "4", features = ["derive"] }
anyhow = "1.0"

[dev-dependencies]
tempfile = "3.8"